<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISLE RECORDS</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Newsreader:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--fg:#1d2733;--ln:color-mix(in srgb,var(--fg) 18%,transparent);--mu:color-mix(in srgb,var(--fg) 58%,transparent);--gold:#b8975a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;height:100%}
body{background:var(--bg);color:var(--fg);font:300 16px/1.7 Jost,system-ui,sans-serif;overflow-x:hidden;transition:background .6s linear}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{max-width:100%;display:block}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
h1,h2{font-weight:200;text-transform:uppercase;letter-spacing:.06em;line-height:1.05}
h1{font-size:clamp(2.6rem,9vw,8rem)}h2{font-size:clamp(1.6rem,4vw,3rem)}
.mu{color:var(--mu)}.sm{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase}
header{position:fixed;inset:0 0 auto 0;z-index:50;height:calc(76px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 22px 0;display:flex;justify-content:flex-end;align-items:center;gap:28px;background:linear-gradient(var(--bg),transparent);background:linear-gradient(color-mix(in srgb,var(--bg) 85%,transparent),transparent)}
nav{display:flex;gap:30px}nav a{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;transition:border-color .3s}
nav a:hover,nav a.on{border-color:currentColor}
.ctl{display:flex;align-items:center;gap:16px}
.sw{width:42px;height:20px;border:1px solid var(--fg);border-radius:20px;position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg);transition:transform .4s}
[data-theme=dark] .sw::after{transform:translateX(22px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:78px;height:24px;background:none}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg)}
input[type=range]::-moz-range-track{height:1px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--fg);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--fg)}
.ic{width:18px;height:18px;flex:none}.ctl{gap:12px}.moon{display:none}[data-theme=dark] .moon{display:block}[data-theme=dark] .sun{display:none}
.mb{display:none;font-size:.74rem;letter-spacing:.22em}
#logo{position:fixed;z-index:60;background:var(--fg);cursor:pointer;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
[data-m=A] #logo{transition:all .5s ease}
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,var(--bg))}
.fog{display:none;position:absolute;inset:0;background:radial-gradient(60% 18% at 30% 58%,rgba(255,255,255,.16),transparent),radial-gradient(50% 14% at 75% 62%,rgba(255,255,255,.12),transparent);animation:fg 70s linear infinite alternate}
[data-m=C] .fog{display:block}[data-theme=dark] .fog{opacity:.4}
@keyframes fg{to{transform:translateX(9%)}}
main{transition:opacity .35s,transform .35s;min-height:100svh}
main.out{opacity:0;transform:translateY(14px)}[data-m=A] main.out{transform:none}
.sec{padding:clamp(80px,13vw,180px) clamp(22px,6vw,90px) 0;max-width:1500px;margin:0 auto}
.pg{padding-top:calc(150px + env(safe-area-inset-top,0px))}
.rv{opacity:0;transition:opacity 1s}.rv.in{opacity:1}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:clamp(28px,4vw,56px)}
.lk{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid var(--ln);padding-bottom:4px;transition:border-color .3s}.lk:hover{border-color:currentColor}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(28px,6vw,100px);align-items:center}
.cv{position:relative;display:block;overflow:hidden;background:var(--ln);aspect-ratio:1}
.cv img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.pl{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px;border:1px solid #fff;border-radius:50%;opacity:0;transition:opacity .4s}
.pl::after{content:"";position:absolute;left:25px;top:20px;border:11px solid transparent;border-left:17px solid #fff;border-right:0}
.rc{text-align:left;display:block;width:100%}.rc:hover img{transform:scale(1.04)}.rc:hover .pl{opacity:1}
.rc b{display:block;margin-top:16px;font-weight:300;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mu)}
.rc span.t{font-size:1.25rem;display:block}.rc small{color:var(--mu)}
.grid{display:grid;gap:clamp(20px,3vw,44px);grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.nw{display:block}.nw .cv{aspect-ratio:16/10}.nw h3{font-weight:200;font-size:clamp(1.3rem,2.4vw,2rem);margin-top:18px;line-height:1.2}
.empty{color:var(--mu);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;border-top:1px solid var(--ln);padding-top:18px}
.scb{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:26px}
iframe{width:100%;border:0;display:block;margin-top:26px}
.art{display:block;position:relative}.art .cv{aspect-ratio:3/2}.art .cv img{object-position:50% 40%}
.art h2{font-size:clamp(2.4rem,9vw,8rem);margin-top:22px}
.ser{font-family:Newsreader,Georgia,serif;font-size:clamp(1.25rem,2.2vw,1.8rem);line-height:1.55;max-width:34em}
.pr{max-width:640px;margin:0 auto;font-family:Newsreader,serif;font-size:1.2rem;line-height:1.8}.pr p{margin-top:1.4em}.pr h2{font-family:Jost;margin-top:2.4em;font-size:1.3rem}
form{display:grid;gap:22px;max-width:640px}
input[type=text],input[type=email],input[type=url],input:not([type]),textarea,select{width:100%;background:none;border:0;border-bottom:1px solid var(--ln);color:var(--fg);font:inherit;padding:12px 0;border-radius:0}
textarea{min-height:120px;resize:vertical}input:focus,textarea:focus,select:focus{outline:0;border-color:var(--fg)}
::placeholder{color:var(--mu)}option{color:#111}
.btn{border:1px solid var(--fg);padding:14px 34px;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;justify-self:start;transition:background .3s,color .3s}.btn:hover{background:var(--fg);color:var(--bg)}
.tabs{display:flex;flex-wrap:wrap;gap:8px 30px;margin:36px 0 48px}.tabs button{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;padding:6px 0;border-bottom:1px solid transparent;color:var(--mu)}.tabs button.on{color:var(--fg);border-color:var(--fg)}
.ck{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;color:var(--mu)}.ck input{margin-top:6px}
.join{text-align:center}.join form{margin:40px auto 0;grid-template-columns:1fr auto;align-items:end;gap:20px}
.msg{color:var(--mu);font-size:.9rem}
.ov{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:none;overflow:auto;padding:90px 22px 40px}
.ov.on{display:block;animation:fi .5s}@keyframes fi{from{opacity:0}}
.ovc{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,70px);align-items:center}
.x{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));right:22px;font-size:2rem;font-weight:200;line-height:1}
footer{margin-top:clamp(100px,14vw,200px);padding:80px clamp(22px,6vw,90px) calc(36px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);position:relative;overflow:hidden}
.fg3{display:grid;grid-template-columns:1fr auto 1fr;gap:40px;align-items:end;max-width:1500px;margin:0 auto}
.fg3 div{display:flex;flex-direction:column;gap:8px}.fg3 div:last-child{align-items:flex-end}
.fg3 a,.fg3 button{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;text-align:left}
#lh{width:90px;height:150px;background:var(--fg);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat;position:relative}
footer::before{content:"";position:absolute;left:50%;top:40px;width:70vw;max-width:800px;height:240px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(226,170,90,.2),transparent);pointer-events:none}
.lg{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 28px;margin:70px auto 0;max-width:1500px;padding-top:24px;border-top:1px solid var(--ln)}
.lg a,.lg button,.lg span{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mu)}.lg div{display:flex;gap:26px;flex-wrap:wrap}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,6vw,90px)}
@media(max-width:860px){.ctl{gap:8px}
nav{position:fixed;inset:0;z-index:55;background:var(--bg);flex-direction:column;justify-content:center;align-items:center;gap:26px;display:none}nav.open{display:flex}nav a{font-size:1.4rem;font-weight:200}
.mb{display:block;z-index:56;position:relative}header{gap:18px}input[type=range]{width:60px}
.two,.ovc,.pd{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.fg3{grid-template-columns:1fr;justify-items:center;text-align:center}.fg3 div,.fg3 div:last-child{align-items:center}
.join form{grid-template-columns:1fr}.lg{justify-content:center}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head><body>

{id:"launch",title:"ISLE RECORDS LAUNCHES TODAY",sub:"A new label begins its journey.",date:"2026-10-06",img:IMG.voy,body:["Today marks the official beginning of ISLE RECORDS — a new home for electronic music, created to bring together distinctive sounds, fresh ideas and artists with their own identity.","To celebrate the launch, ISLE RECORDS arrives with three debut releases, all produced by TOMAHAWK: “Voyage d’été”, “Wide Awake” and “Cosmic Motion”.","Three different tracks. Three different moods. One starting point.","With today’s release, TOMAHAWK becomes the first artist to officially release through ISLE RECORDS, opening the label’s story with a first glimpse of the sound and direction that will define its journey.","And this is only the beginning.","Welcome to ISLE RECORDS."]},
{id:"signing",title:"TOMAHAWK JOINS ISLE RECORDS",sub:"The first artist officially joins the island.",date:"2026-10-06",img:IMG.tom,body:["ISLE RECORDS is proud to announce TOMAHAWK as the label’s first officially signed artist.","Marking the beginning of a new chapter for both artist and label, TOMAHAWK joins ISLE RECORDS with a clear musical identity and a shared vision for the future.","His first releases on the label — “Voyage d’été”, “Wide Awake” and “Cosmic Motion” — are already part of the launch that officially opens the doors of ISLE RECORDS today.","This signing marks the first step in what is set to become a growing family of artists, sounds and stories.","Welcome to ISLE RECORDS, TOMAHAWK!"]}], /* {id,title,sub,date,img,body:[]} */

mpc=p=>`<a class="rc" href="#/merch/${p.id}"><span class="cv"><img src="${p.imgs[0]||""}" alt="${p.name}"></span><b>${p.name}</b><span class="t">€${p.price}</span></a>`,
emp=t=>`<p class="empty">${t}</p>`;
let theme=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light",cart=[],route="";
/* ===== PAGES ===== */
const pages={
home(){const f=feat(),a=art(f.artist),ns=news().slice(0,2),ms=DATA.merch.slice(0,2);return `
<section class="hero"><canvas id="sea"></canvas><div class="fog"></div></section>
<section class="sec rv"><div class="row"><h2>Latest Release</h2></div><div class="two"><button class="cv rc" data-play="${f.id}" style="cursor:pointer"><img src="${f.cover}" alt="${f.title}"><i class="pl"></i></button><div><p class="mu sm">${a.name}</p><h2 style="margin:12px 0">${f.title}</h2><p class="mu">${fd(f.date)}</p>${sc(f.sc)}</div></div></section>
<section class="sec rv"><div class="row"><h2>Latest News</h2></div>${ns.length?`<div class="grid g2">${ns.map(nwc).join("")}</div>`:emp("No news yet")}</section>
<section class="sec rv"><div class="row"><h2>Artists</h2></div>${DATA.artists.map(x=>`<a class="art" href="#/artists/${x.id}"><span class="cv"><img src="${x.photo}" alt="${x.name}"></span><h2>${x.name}</h2></a>`).join("")}<p style="margin-top:40px"><a class="lk" href="#/artists">+ All Artists</a></p></section>
<section class="sec rv"><div class="row"><h2>Music</h2><a class="lk" href="#/music">All Releases</a></div><div class="grid">${rels().slice(0,3).map(card).join("")}</div></section>
<section class="sec rv"><div class="row"><h2>Merch</h2><a class="lk" href="#/merch">Shop</a></div>${ms.length?`<div class="grid g2">${ms.map(mpc).join("")}</div>`:emp("Coming soon")}</section>
<section class="sec rv"><div class="row"><h2>About</h2></div>${DATA.about.short.length?`<p class="ser">${DATA.about.short.slice(0,3).join(" ")}</p>`:""}<p style="margin-top:36px"><a class="lk" href="#/about">Discover More</a></p></section>
<section class="sec rv join"><h1 style="font-size:clamp(2.4rem,8vw,7rem)">Join the Isle</h1><form data-f="join"><input type="email" name="email" placeholder="E-mail" required aria-label="E-mail"><button class="btn">Join</button><p class="msg" style="grid-column:1/-1"></p></form></section>`},
article(id){const n=DATA.news.find(x=>x.id==id);if(!n)return pages.home();return `<section class="sec pg"><p class="mu sm">${fd(n.date)}</p><h1 style="font-size:clamp(2rem,6vw,5rem);margin:18px 0 24px">${n.title}</h1><p class="ser" style="font-style:italic;margin-bottom:50px">${n.sub}</p><div class="cv" style="aspect-ratio:16/9"><img src="${n.img}" alt=""></div><div class="pr">${n.body.map(p=>`<p>${p}</p>`).join("")}</div><p style="margin-top:60px"><a class="lk" href="#/">Back to Home</a></p></section>`},
about(){const L=DATA.about.long;return `<section class="sec pg"><h1>About</h1><div class="pr">${L.map(s=>`${s.h?`<h2>${s.h}</h2>`:""}${s.p.map(p=>`<p>${p}</p>`).join("")}`).join("")}</div></section>`},
music(){return `<section class="sec pg"><h1 style="margin-bottom:clamp(40px,6vw,80px)">Music</h1><div class="grid">${rels().map(card).join("")}</div></section>`},
artists(){return `<section class="sec pg"><h1 style="margin-bottom:clamp(40px,6vw,80px)">Artists</h1>${DATA.artists.map(x=>{const r=rels().filter(r=>r.artist==x.id);return `<div style="margin-bottom:120px"><a class="art" href="#/artists/${x.id}"><span class="cv"><img src="${x.photo}" alt="${x.name}"></span><h2>${x.name}</h2></a><div class="grid" style="margin-top:40px">${r.slice(0,3).map(card).join("")}</div>${r.length>3?`<div class="grid mr" style="display:none;margin-top:40px">${r.slice(3).map(card).join("")}</div><p style="margin-top:36px"><button class="lk" data-more>More Releases</button></p>`:""}</div>`}).join("")}</section>`},
artist(id){const x=art(id);if(!x)return pages.artists();return `<section class="sec pg"><div class="cv" style="aspect-ratio:16/9"><img src="${x.photo}" alt="${x.name}" style="object-position:50% 38%"></div><h1 style="margin:40px 0">${x.name}</h1>${x.bio?`<p class="ser">${x.bio}</p>`:""}<div class="grid" style="margin-top:70px">${rels().filter(r=>r.artist==id).map(card).join("")}</div><p style="margin-top:60px;display:flex;gap:34px;flex-wrap:wrap">${x.links.map(k=>`<a class="lk" href="${k.u}" target="_blank" rel="noopener">${k.l}</a>`).join("")}</p></section>`},
merch(){return `<section class="sec pg"><div class="row"><h1>Merch</h1><a class="lk" href="#/cart">Cart (${cart.length})</a></div>${DATA.merch.length?`<div class="grid">${DATA.merch.map(mpc).join("")}</div>`:emp("Coming soon")}</section>`},
product(id){const p=DATA.merch.find(x=>x.id==id);if(!p)return pages.merch();return `<section class="sec pg"><div class="pd"><div>${p.imgs.map(i=>`<img src="${i}" alt="" style="margin-bottom:20px">`).join("")}</div><div style="position:sticky;top:120px;align-self:start"><h2>${p.name}</h2><p style="margin:12px 0 24px">€${p.price}</p><p class="mu">${p.desc||""}</p><form data-f="add" style="margin-top:30px"><select name="size" aria-label="Size">${(p.sizes||[]).map(s=>`<option>${s}</option>`).join("")}</select><input type="hidden" name="id" value="${p.id}"><button class="btn">Add to cart</button></form></div></div></section>`},
cart(){const t=cart.reduce((s,i)=>s+i.price,0);return `<section class="sec pg"><div class="row"><h1>Cart</h1></div>${cart.length?`${cart.map(i=>`<p style="display:flex;justify-content:space-between;border-top:1px solid var(--ln);padding:14px 0;max-width:640px"><span>${i.name} ${i.size?`(${i.size})`:""}</span><span>€${i.price}</span></p>`).join("")}<p style="margin:20px 0 50px;max-width:640px;text-align:right">Total €${t}</p><form data-f="order"><input name="name" placeholder="Full name" required><input type="email" name="email" placeholder="E-mail" required><textarea name="addr" placeholder="Shipping address" required></textarea><button class="btn">Checkout</button><p class="msg"></p></form>`:emp("Your cart is empty")}</section>`},
contact(c="general"){const T={general:["name","email","message"],demo:["name","email","genre","message","link","terms"],booking:["name","email","event","message"],press:["name","outlet","email","message"],business:["name","company","email","message"]};
const F={name:c=="demo"?"Name / Artist name":"Name",email:"E-mail",genre:"Genre (optional)",message:"Message",link:"Demo link (SoundCloud, Dropbox, private link)",event:"Event & date",outlet:"Outlet",company:"Company"};
return `<section class="sec pg"><h1>Contact</h1><div class="tabs">${Object.keys(T).map(k=>`<button data-c="${k}" class="${k==c?"on":""}">${k}</button>`).join("")}</div><form data-f="contact"><input type="hidden" name="category" value="${c}">${T[c].map(k=>k=="message"?`<textarea name="message" placeholder="${F[k]}" required></textarea>`:k=="terms"?`<label class="ck"><input type="checkbox" required><span>I accept the Submission Terms.</span></label>`:`<input ${k=="email"?'type="email"':k=="link"?'type="url"':""} name="${k}" placeholder="${F[k]}" ${k=="genre"?"":"required"} aria-label="${F[k]}">`).join("")}<button class="btn">Send</button><p class="msg"></p></form></section>`}};
const footer=()=>`<footer><div class="fg3"><div>${["home","about","music","artists","merch","contact"].map(n=>`<a href="#/${n=="home"?"":n}">${n}</a>`).join("")}</div><div style="align-items:center"><span id="lh"></span></div><div>${DATA.social.map(s=>`<a href="${s.u}" target="_blank" rel="noopener">${s.l}</a>`).join("")}<a href="#/contact">Contact</a></div></div><div class="lg"><div><a href="${DATA.legal.imprint||"#"}">Imprint</a><a href="${DATA.legal.privacy||"#"}">Privacy</a><button data-ck>Cookie Settings</button></div><span>© ${new Date().getFullYear()} ISLE RECORDS</span></div></footer>`;
/* ===== ROUTER ===== */
const NAV=["home","about","music","artists","merch","contact"];
$("#nav").innerHTML=NAV.map(n=>`<a href="#/${n=="home"?"":n}" data-n="${n}">${n}</a>`).join("");
function render(){const h=location.hash.replace(/^#\/?/,""),[p,q]=h.split("/");route=p||"home";
const html=route=="home"?pages.home():route=="artists"&&q?pages.artist(q):route=="merch"&&q?pages.product(q):route=="news"&&q?pages.article(q):route=="cart"?pages.cart():pages[route]?pages[route]():pages.home();
$("#app").innerHTML=html;$("#ft").innerHTML=footer();$("#lh").style.webkitMask=$("#lh").style.mask=`url(${IMG.lh}) center/contain no-repeat`;
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.n==(route=="cart"?"merch":route)));
$("#nav").classList.remove("open");scrollTo(0,0);bind();setSea();place();paint();}
function go(){const m=$("#app");m.classList.add("out");setTimeout(()=>{render();requestAnimationFrame(()=>m.classList.remove("out"))},M=="A"?180:340)}
addEventListener("hashchange",go);
$("#mb").onclick=()=>$("#nav").classList.toggle("open");
$("#logo").onclick=()=>{location.hash.replace("#","").replace("/","")?location.hash="#/":scrollTo({top:0})};
/* ===== INTERACTION ===== */
function bind(){const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll(".rv").forEach(e=>io.observe(e));
document.querySelectorAll("[data-ld]").forEach(b=>b.onclick=()=>{b.parentNode.insertAdjacentHTML("afterend",ifr(b.dataset.ld));b.remove()});
document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>openRel(b.dataset.play));
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{$("#app").innerHTML=pages.contact(b.dataset.c);bind()});
const m=document.querySelector("[data-more]");if(m)m.onclick=()=>{document.querySelector(".mr").style.display="grid";m.parentNode.remove()};
document.querySelectorAll("form").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const k=f.dataset.f,msg=f.querySelector(".msg"),d=Object.fromEntries(new FormData(f));
if(k=="add"){const p=DATA.merch.find(x=>x.id==d.id);cart.push({name:p.name,price:p.price,size:d.size});location.hash="#/cart";return}
if(!CONFIG.FORM_ENDPOINT){msg.textContent="Form endpoint not connected yet (CONFIG.FORM_ENDPOINT).";return}
try{const r=await fetch(CONFIG.FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({form:k,...d})});if(!r.ok)throw 0;f.reset();msg.textContent="Sent."}catch(_){msg.textContent="Sending failed. Please try again."}});}
const ov=$("#ov");
function openRel(id){const r=DATA.releases.find(x=>x.id==id);ov.innerHTML=`<button class="x" aria-label="Close">×</button><div class="ovc"><img src="${r.cover}" alt="${r.title}"><div><p class="mu sm">${art(r.artist).name}</p><h2 style="margin:12px 0">${r.title}</h2><p class="mu">${fd(r.date)}</p>${sc(r.sc)}</div></div>`;ov.classList.add("on");ov.querySelector(".x").onclick=closeRel}
function closeRel(){ov.classList.remove("on");ov.innerHTML=""}
addEventListener("keydown",e=>{if(e.key=="Escape")closeRel()});
/* ===== THEME + SCROLL COLOR ===== */
const P={light:[["#f4efe6","#1d2733"],["#f3e8d4","#1d2733"],["#ecd9bb","#2b2520"]],dark:[["#0b1424","#ece8df"],["#050607","#ece8df"],["#04070d","#ece8df"]]};
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),mix=(a,b,t)=>hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t));
function paint(){const t=Math.min(1,scrollY/Math.max(1,root.scrollHeight-innerHeight)),s=P[theme],x=t*2,i=Math.min(1,Math.floor(x)),f=x-i;
root.style.setProperty("--bg",`rgb(${mix(s[i][0],s[i+1][0],f)})`);root.style.setProperty("--fg",`rgb(${mix(s[i][1],s[i+1][1],f)})`);root.style.setProperty("--gold",theme=="dark"?"#d9b77a":"#b8975a")}
$("#th").onclick=()=>{theme=theme=="dark"?"light":"dark";root.dataset.theme=theme;paint();drawSea(0)};
root.dataset.theme=theme;
/* ===== LOGO ===== */
const lg=$("#logo");lg.style.webkitMask=lg.style.mask=`url(${IMG.logo}) center/contain no-repeat`;
const lerp=(a,b,t)=>a+(b-a)*t;
function place(){const home=route=="home";let p=home?Math.min(1,scrollY/(innerHeight*.55)):1;if(M=="A")p=p>.05?1:0;p=p*p*(3-2*p);
const H0=Math.min(innerHeight*.58,460,innerWidth*.78/IMG.ratio),H1=innerWidth<860?50:58,h=lerp(H0,H1,p),w=h*IMG.ratio;
lg.style.height=h+"px";lg.style.width=w+"px";lg.style.left=lerp(innerWidth/2-w/2,22,p)+"px";lg.style.top=lerp(innerHeight/2-h/2,12,p)+"px";}
/* ===== SEA ===== */
let cv,cx,dpr=Math.min(devicePixelRatio||1,1.5),raf;
function setSea(){cv=$("#sea");cancelAnimationFrame(raf);if(!cv)return;cx=cv.getContext("2d");sizeSea();if(M=="C"&&!matchMedia("(prefers-reduced-motion:reduce)").matches)loop(0);else drawSea(0)}
function sizeSea(){if(!cv)return;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr}
function loop(t){drawSea(t);raf=requestAnimationFrame(loop)}
function drawSea(t){if(!cv)return;const w=cv.width,h=cv.height,hz=h*.58,d=theme=="dark";
let g=cx.createLinearGradient(0,0,0,hz);g.addColorStop(0,d?"#050a15":"#c7dbe5");g.addColorStop(1,d?"#1b2842":"#f6eee0");cx.fillStyle=g;cx.fillRect(0,0,w,hz+1);
g=cx.createLinearGradient(0,hz,0,h);g.addColorStop(0,d?"#111b30":"#bcd2d6");g.addColorStop(1,d?"#04070d":"#6e9cae");cx.fillStyle=g;cx.fillRect(0,hz,w,h-hz);
if(d){g=cx.createRadialGradient(w*.5,hz,0,w*.5,hz,w*.3);g.addColorStop(0,"rgba(235,190,120,.16)");g.addColorStop(1,"rgba(235,190,120,0)");cx.fillStyle=g;cx.fillRect(0,hz-w*.1,w,w*.5)}
cx.lineWidth=dpr;for(let i=1;i<=26;i++){const k=i/26,y=hz+(h-hz)*k*k,a=(1+k*10)*dpr;cx.beginPath();
for(let x=0;x<=w+24;x+=24*dpr){const yy=y+Math.sin(x/(w*.05*(1.5-k))+t*.0004*(.5+k)+i)*a*.4+Math.sin(x/(w*.13)+t*.0002+i*2)*a*.3;x?cx.lineTo(x,yy):cx.moveTo(x,yy)}
cx.strokeStyle=d?`rgba(150,180,225,${.04+k*.09})`:`rgba(255,255,255,${.1+k*.2})`;cx.stroke()}
cx.fillStyle=d?"rgba(235,200,150,.25)":"rgba(255,255,255,.6)";cx.fillRect(0,hz,w,dpr)}
addEventListener("scroll",()=>{paint();place();if(M!="A"&&cv)cv.style.transform=`translateY(${Math.min(scrollY,innerHeight)*.22}px)`},{passive:true});
addEventListener("resize",()=>{sizeSea();drawSea(0);place()});
/* ===== AMBIENT SOUND (off by default, starts only after user moves slider) ===== */
let ac,gn;function initAudio(){ac=new(window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*6,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5}
const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=520;const sw=ac.createGain();sw.gain.value=.55;const o=ac.createOscillator();o.frequency.value=.085;const og=ac.createGain();og.gain.value=.35;o.connect(og);og.connect(sw.gain);gn=ac.createGain();gn.gain.value=0;s.connect(f);f.connect(sw);sw.connect(gn);gn.connect(ac.destination);s.start();o.start()}
$("#vol").oninput=e=>{const v=e.target.value/100;if(!ac){if(!v)return;initAudio()}ac.resume();gn.gain.setTargetAtTime(v*v*.9,ac.currentTime,.15)};
render();
</script></body></html>
